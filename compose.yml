services:
  mysql:
    image: mysql:8.0.41
    container_name: todonext-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todonext_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: todonext-backend
    depends_on:
      - mysql
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: todonext_db
      DB_USER: appuser
      DB_PASSWORD: password
      PORT: 4000

  frontend:
    build: ./frontend
    container_name: todonext-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000

volumes:
  mysql-data: